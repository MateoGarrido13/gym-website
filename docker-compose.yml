version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine 
    container_name: postgrestp2
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tp2_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tp2_db"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
