version: "2"
sql:
  - engine: "postgresql"
    queries: "./db/queries/"
    schema: "./db/schema/"
    gen:
      go:
        package: "db"
        out: "./db/sqlc/"
        emit_json_tags: true
        overrides:
          - db_type: "enum_rol"
            go_type: "string"
          - db_type: "enum_dia_semana"
            go_type: "string"